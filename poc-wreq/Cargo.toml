[package]
name = "poc-wreq"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
wreq = { version = "6.0.0-rc.31", features = ["json", "cookies", "gzip", "brotli", "zstd"] }
wreq-util = "3.0.0-rc.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
